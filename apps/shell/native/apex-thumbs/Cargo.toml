[package]
name = "apex-thumbs"
description = "Apex Office's Windows Explorer thumbnail handler: a small COM library that asks the program for a picture of a document's first page"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Its own workspace: the library is built on its own at packaging time.
[workspace]

[lib]
name = "apex_thumbs"
crate-type = ["cdylib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# `#[implement]` expands to paths in `windows_core`, so the crate must depend on it directly.
windows-core = "0.62"
windows = { version = "0.62", default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
png = "0.18"
